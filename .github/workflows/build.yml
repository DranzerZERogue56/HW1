name: Build & Test

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test-and-build:
    name: Unit Tests + Debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew :app:test --no-daemon

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: app/build/reports/tests/

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Rename APK
        run: mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/GlobalMute-debug.apk

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GlobalMute-debug
          path: app/build/outputs/apk/debug/GlobalMute-debug.apk

      - name: Publish GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-latest
          name: "GlobalMute – latest debug build"
          body: |
            **Tap `GlobalMute-debug.apk` below to install on your Android device.**

            Built from commit `${{ github.sha }}` on branch `${{ github.ref_name }}`.

            > Enable "Install from unknown sources" in Settings → Apps → your browser/file manager first.
          files: app/build/outputs/apk/debug/GlobalMute-debug.apk
          make_latest: true
          prerelease: true
